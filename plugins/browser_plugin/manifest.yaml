name: browser_plugin
permissions:
  - draft_browser_research_plan
  - summarize_public_page
  - propose_browser_action
forbidden:
  - submit_forms_without_approval
  - login_without_approval
  - purchase_without_approval
  - download_files_without_approval
  - bypass_website_policy
risk_level: high
allowed_data_classes:
  - public
requires_approval:
  - open_external_site
  - submit_form
  - login
  - download_file
  - browser_action
max_autonomous_level: 1
sandbox:
  network: deny_until_connector_approved
  filesystem: deny
  execution: draft_only
signed_connector:
  status: unsigned
  signer: ""
  signature: ""
