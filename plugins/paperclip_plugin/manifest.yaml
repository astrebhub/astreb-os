name: paperclip_plugin
permissions:
  - create_task_draft
  - read_task_status
forbidden:
  - delete_task_without_approval
risk_level: low
allowed_data_classes:
  - public
  - internal
requires_approval:
  - create_task
max_autonomous_level: 2
sandbox:
  network: deny_until_connector_approved
  filesystem: deny
  execution: no_direct_execution
signed_connector:
  status: unsigned
  signer: ""
  signature: ""
