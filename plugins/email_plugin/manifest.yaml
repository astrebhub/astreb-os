name: email_plugin
permissions:
  - read_email
  - draft_email
forbidden:
  - send_email_without_approval
  - delete_email_without_approval
risk_level: medium
allowed_data_classes:
  - public
  - internal
requires_approval:
  - send_email
  - delete_email
max_autonomous_level: 2
sandbox:
  network: deny_until_connector_approved
  filesystem: deny
  execution: no_direct_execution
