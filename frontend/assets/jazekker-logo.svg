    <circle r="92" fill="none" stroke="#d8d8d8" stroke-width="2" opacity=".75"/>
    <circle r="76" fill="none" stroke="#a7a7a7" stroke-width="1" opacity=".55"/>
    <g stroke="#e7e7e7" stroke-width="2" opacity=".85">
      <line x1="0" y1="-102" x2="0" y2="-88"/>
      <line x1="0" y1="102" x2="0" y2="88"/>
      <line x1="-102" y1="0" x2="-88" y2="0"/>
      <line x1="102" y1="0" x2="88" y2="0"/>
      <line x1="72" y1="-72" x2="62" y2="-62"/>
      <line x1="-72" y1="72" x2="-62" y2="62"/>
      <line x1="-72" y1="-72" x2="-62" y2="-62"/>
      <line x1="72" y1="72" x2="62" y2="62"/>
    </g>
    <text x="0" y="-72" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#f4f4f4">N</text>
    <text x="73" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#f4f4f4">E</text>
    <text x="0" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#f4f4f4">S</text>
    <text x="-73" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#f4f4f4">W</text>
    <g>
      <path d="M0,-98 L18,-18 L0,-7 L-18,-18 Z" fill="url(#steel)"/>
      <path d="M98,0 L18,18 L7,0 L18,-18 Z" fill="url(#steel)"/>
      <path d="M0,98 L-18,18 L0,7 L18,18 Z" fill="#6f7780"/>
      <path d="M-98,0 L-18,-18 L-7,0 L-18,18 Z" fill="#6f7780"/>
      <path d="M70,-70 L16,-8 L9,-16 Z" fill="#f5f5f5"/>
      <path d="M-70,70 L-16,8 L-9,16 Z" fill="#7d858b"/>
    </g>
