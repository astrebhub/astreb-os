<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">JAZEKKER</title>
  <desc id="desc">A black metallic compass emblem with the JAZEKKER wordmark and the phrase Ik ga het rustig aan doen.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="58%" stop-color="#070707"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="dial" cx="48%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="72%" stop-color="#080808"/>
      <stop offset="100%" stop-color="#010101"/>
    </radialGradient>
    <linearGradient id="steel" x1="16%" y1="0%" x2="84%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="18%" stop-color="#9b9b9b"/>
      <stop offset="42%" stop-color="#f6f6f6"/>
      <stop offset="66%" stop-color="#6d6d6d"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
    <linearGradient id="darkSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2f2f2"/>
      <stop offset="40%" stop-color="#5c6368"/>
      <stop offset="100%" stop-color="#111417"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe494"/>
      <stop offset="50%" stop-color="#b47922"/>
      <stop offset="100%" stop-color="#f4c866"/>
    </linearGradient>
    <filter id="shadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".7"/>
    </filter>
    <filter id="engrave">
      <feDropShadow dx="1" dy="1" stdDeviation=".6" flood-color="#ffffff" flood-opacity=".5"/>
      <feDropShadow dx="-1" dy="-1" stdDeviation=".8" flood-color="#000000" flood-opacity=".9"/>
    </filter>
    <pattern id="brushed" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 2 H14 M0 7 H14 M0 12 H14" stroke="#fff" stroke-width=".55" opacity=".16"/>
      <path d="M0 4 H14 M0 10 H14" stroke="#000" stroke-width=".55" opacity=".24"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g transform="translate(512 340)" filter="url(#shadow)">
    <circle r="265" fill="url(#darkSteel)"/>
    <circle r="239" fill="url(#dial)" stroke="#e7e7e7" stroke-width="5"/>
    <circle r="204" fill="none" stroke="#d7d7d7" stroke-width="3" opacity=".82"/>
    <circle r="172" fill="none" stroke="#8f969b" stroke-width="2" opacity=".46"/>
    <circle r="266" fill="url(#brushed)" opacity=".38"/>

    <g stroke="#f4f4f4" opacity=".88">
      <g stroke-width="4">
        <line x1="0" y1="-223" x2="0" y2="-198"/>
        <line x1="0" y1="223" x2="0" y2="198"/>
        <line x1="-223" y1="0" x2="-198" y2="0"/>
        <line x1="223" y1="0" x2="198" y2="0"/>
      </g>
      <g stroke-width="2">
        <line x1="111" y1="-193" x2="99" y2="-172"/>
        <line x1="193" y1="-111" x2="172" y2="-99"/>
        <line x1="193" y1="111" x2="172" y2="99"/>
        <line x1="111" y1="193" x2="99" y2="172"/>
        <line x1="-111" y1="193" x2="-99" y2="172"/>
        <line x1="-193" y1="111" x2="-172" y2="99"/>
        <line x1="-193" y1="-111" x2="-172" y2="-99"/>
        <line x1="-111" y1="-193" x2="-99" y2="-172"/>
      </g>
    </g>

    <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="58" fill="url(#steel)" filter="url(#engrave)">
      <text x="0" y="-154" text-anchor="middle">E</text>
      <text x="146" y="-112" text-anchor="middle" transform="rotate(35 146 -112)">SE</text>
      <text x="169" y="24" text-anchor="middle">S</text>
      <text x="116" y="145" text-anchor="middle" transform="rotate(-34 116 145)">SW</text>
      <text x="0" y="179" text-anchor="middle">M</text>
      <text x="-119" y="142" text-anchor="middle" transform="rotate(34 -119 142)">NN</text>
      <text x="-169" y="20" text-anchor="middle">N</text>
      <text x="-122" y="-112" text-anchor="middle" transform="rotate(-34 -122 -112)">NE</text>
    </g>

    <g>
      <path d="M0,-185 L31,-30 L0,-10 L-31,-30 Z" fill="url(#steel)"/>
      <path d="M185,0 L31,30 L10,0 L31,-30 Z" fill="url(#steel)"/>
      <path d="M0,185 L-31,30 L0,10 L31,30 Z" fill="#5e686f"/>
      <path d="M-185,0 L-31,-30 L-10,0 L-31,30 Z" fill="#5e686f"/>
      <path d="M170,-150 L28,-12 L13,-30 Z" fill="url(#steel)"/>
      <path d="M-170,150 L-28,12 L-13,30 Z" fill="#68727a"/>
      <path d="M102,96 L24,18 L37,6 Z" fill="#89939b" opacity=".65"/>
      <path d="M-102,-96 L-24,-18 L-37,-6 Z" fill="#f7f7f7" opacity=".78"/>
    </g>
    <circle r="35" fill="#020202" opacity=".9"/>
    <circle r="25" fill="url(#gold)" stroke="#2a1707" stroke-width="5"/>
    <circle r="11" fill="#7d4f17" opacity=".9"/>
  </g>

  <text x="512" y="776" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="124" font-weight="700" letter-spacing="2" fill="url(#steel)" stroke="#0a0a0a" stroke-width="2.2" filter="url(#engrave)">JAZEKKER</text>
  <path d="M182 822 H842 M394 832 H630 L512 876 Z" fill="none" stroke="url(#steel)" stroke-width="5" opacity=".94"/>
  <line x1="150" y1="915" x2="205" y2="915" stroke="url(#steel)" stroke-width="4" opacity=".9"/>
  <line x1="819" y1="915" x2="874" y2="915" stroke="url(#steel)" stroke-width="4" opacity=".9"/>
  <text x="512" y="934" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="43" letter-spacing="7" fill="url(#steel)" filter="url(#engrave)">Ik ga het rustig aan doen</text>
</svg>
