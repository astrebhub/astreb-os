<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">JAZEKKER</title>
  <desc id="desc">Compass logo with JAZEKKER and subtitle portal of calm orientation.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="62%">
      <stop offset="0%" stop-color="#151515"/>
      <stop offset="72%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="steel" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#8f8f8f"/>
      <stop offset="48%" stop-color="#f2f2f2"/>
      <stop offset="72%" stop-color="#6f6f6f"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe18c"/>
      <stop offset="55%" stop-color="#b8822c"/>
      <stop offset="100%" stop-color="#f5c765"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="900" height="520" rx="18" fill="url(#bg)"/>
  <g transform="translate(450 174)" filter="url(#softShadow)">
