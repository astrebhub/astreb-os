  <text x="450" y="385" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" letter-spacing="2" fill="url(#steel)" stroke="#111" stroke-width="1.5">JAZEKKER</text>
  <path d="M198 413 H702 M370 421 H530 L450 456 Z" fill="none" stroke="url(#steel)" stroke-width="4" opacity=".92"/>
  <text x="450" y="487" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" letter-spacing="4" fill="#d8c891">портал спокойной ориентации</text>
