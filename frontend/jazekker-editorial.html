<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JAZEKKER Editorial Control</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071019;
      --panel: #0d1a25;
      --line: #22384b;
      --text: #edf4f7;
      --muted: #9badba;
      --gold: #e2b354;
      --green: #6fd2a5;
      --red: #e36f62;
      --blue: #73a8ff;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at 72% 0%, #11243a 0, var(--bg) 36%); color: var(--text); }
    .shell { width: min(1340px, calc(100% - 32px)); margin: 0 auto; padding: 22px 0 50px; }
    header { display: flex; justify-content: space-between; gap: 16px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
    h1, h2, h3 { margin: 0; letter-spacing: 0; }
    h1 { font-size: 30px; }
    p { color: var(--muted); line-height: 1.5; }
    a { color: inherit; }
    input, select, textarea {
      min-height: 40px; border: 1px solid var(--line); border-radius: 6px; background: #081521; color: var(--text);
      padding: 0 11px; font: inherit;
    }
    textarea { width: 100%; min-height: 86px; padding: 10px 11px; }
    button, .button {
      min-height: 40px; border: 1px solid var(--line); border-radius: 6px; background: #12283a; color: var(--text);
      padding: 0 12px; font: inherit; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;
    }
    button.primary { background: var(--gold); border-color: var(--gold); color: #071019; }
    button.danger { background: #32191a; border-color: #5a282a; color: #ffbeb7; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
    .grid { display: grid; grid-template-columns: 430px 1fr; gap: 16px; margin-top: 20px; }
    .panel { border: 1px solid var(--line); border-radius: 8px; background: rgba(13, 27, 40, .88); padding: 16px; }
    .list { display: grid; gap: 10px; margin-top: 12px; max-height: 70vh; overflow: auto; }
    .item { border: 1px solid var(--line); border-radius: 8px; background: #0b1722; padding: 12px; cursor: pointer; }
    .item.active { border-color: var(--gold); }
    .meta, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; min-height: 23px; padding: 3px 8px; border-radius: 6px; background: #142a3c; color: #c8d5df; font-size: 12px; }
    .chip.green { background: #153529; color: #aee7c7; }
    .chip.red { background: #35191a; color: #ffc2ba; }
    .chip.gold { background: #332914; color: #f1d28b; }
    .detail-head { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
    .score-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 16px 0; }
    .score { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: #081521; }
    .score strong { display: block; font-size: 22px; margin-top: 4px; }
    .draft { white-space: pre-wrap; border: 1px solid var(--line); border-radius: 8px; background: #081521; padding: 12px; color: #d7e1e8; }
    .audit { display: grid; gap: 8px; margin-top: 10px; }
    .audit-row { border-top: 1px solid var(--line); padding-top: 8px; color: #c9d5de; font-size: 13px; }
    .status { color: var(--muted); min-height: 20px; font-size: 13px; margin-top: 8px; }
    @media (max-width: 980px) { .grid, .score-row { grid-template-columns: 1fr; } header { align-items: start; flex-direction: column; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>JAZEKKER Editorial Control</h1>
        <p>Governed workflow: intake -> classification -> review -> approval -> publication -> audit.</p>
      </div>
      <div class="toolbar">
        <input id="token" placeholder="Admin token" />
        <a class="button" href="/jazekker/news">Лента</a>
        <a class="button" href="/jazekker">Portal</a>
      </div>
    </header>

    <section class="toolbar">
      <button id="seedLocal" class="primary">Ingest local articles</button>
      <button id="ingestNews">Ingest saved RSS</button>
      <button id="refresh">Refresh objects</button>
      <select id="statusFilter">
        <option value="">all statuses</option>
      </select>
      <select id="rubricFilter">
        <option value="">all rubrics</option>
      </select>
    </section>
    <div id="status" class="status">Ready.</div>

    <main class="grid">
      <section class="panel">
        <h2>Orientation Objects</h2>
        <div id="objects" class="list"></div>
      </section>

      <section class="panel" id="detail">
        <h2>Select an object</h2>
        <p>Use the left list to inspect governance metadata, sources, draft, approval state, and audit history.</p>
      </section>
    </main>
  </div>

  <script>
    const token = document.getElementById("token");
    const statusEl = document.getElementById("status");
    const objectsEl = document.getElementById("objects");
    const detailEl = document.getElementById("detail");
    const statusFilter = document.getElementById("statusFilter");
    const rubricFilter = document.getElementById("rubricFilter");
    let objects = [];
    let selected = null;
    token.value = localStorage.getItem("AI_CABINET_ADMIN_TOKEN") || "";
    token.addEventListener("input", () => localStorage.setItem("AI_CABINET_ADMIN_TOKEN", token.value));
    function headers() { return {"Content-Type": "application/json", "X-AI-Cabinet-Admin-Token": token.value}; }
    function esc(value) { return String(value ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;"); }
    function chipClass(value) {
      if (["approved", "published_local", "published_external"].includes(value)) return "green";
      if (["blocked", "high", "critical"].includes(value)) return "red";
      if (["review_required", "scheduled", "medium"].includes(value)) return "gold";
      return "";
    }
    function filtered() {
      return objects.filter(item => (!statusFilter.value || item.status === statusFilter.value) && (!rubricFilter.value || item.rubric === rubricFilter.value));
    }
    function renderFilters(statuses = []) {
      if (statusFilter.options.length <= 1) statuses.forEach(s => statusFilter.add(new Option(s, s)));
      const rubrics = [...new Set(objects.map(o => o.rubric).filter(Boolean))].sort();
      rubricFilter.innerHTML = '<option value="">all rubrics</option>';
      rubrics.forEach(r => rubricFilter.add(new Option(r, r)));
    }
    function renderList() {
      objectsEl.innerHTML = "";
      filtered().forEach(item => {
        const div = document.createElement("div");
        div.className = `item ${selected === item.id ? "active" : ""}`;
        div.onclick = () => loadDetail(item.id);
        div.innerHTML = `
          <div class="chips">
            <span class="chip ${chipClass(item.status)}">${esc(item.status)}</span>
            <span class="chip ${chipClass(item.risk_level)}">${esc(item.risk_level)}</span>
            <span class="chip">${esc(item.rubric)}</span>
          </div>
          <h3>${esc(item.title)}</h3>
          <p>${esc(item.summary || item.signal || "").slice(0, 180)}</p>
        `;
        objectsEl.appendChild(div);
      });
    }
    function renderDetail(data) {
      const item = data.object;
      const audit = data.audit || [];
      selected = item.id;
      renderList();
      detailEl.innerHTML = `
        <div class="detail-head">
          <div>
            <div class="chips">
              <span class="chip ${chipClass(item.status)}">${esc(item.status)}</span>
              <span class="chip ${chipClass(item.risk_level)}">${esc(item.risk_level)}</span>
              <span class="chip">${esc(item.governance_status)}</span>
              <span class="chip">${esc(item.publication_target)}</span>
            </div>
            <h2>${esc(item.title)}</h2>
            <p>${esc(item.summary)}</p>
          </div>
        </div>
        <div class="score-row">
          <div class="score">Confidence<strong>${esc(item.confidence_score)}</strong></div>
          <div class="score">Orientation<strong>${esc(item.orientation_score)}</strong></div>
          <div class="score">Sources<strong>${esc(item.source_count)}</strong></div>
          <div class="score">Approval<strong>${item.human_approved ? "yes" : "no"}</strong></div>
        </div>
        <h3>Governance</h3>
        <p>${esc(item.governance_notes)}</p>
        <p><strong>Policy:</strong> ${esc(item.policy_applied)}<br><strong>Risk reason:</strong> ${esc(item.risk_reason)}<br><strong>Review notes:</strong> ${esc(item.review_notes)}</p>
        <h3>Generated draft</h3>
        <div class="draft">${esc(item.generated_draft || "")}</div>
        <h3>Sources</h3>
        ${(item.sources || []).map(source => `<p><a href="${esc(source.url)}" target="_blank" rel="noreferrer">${esc(source.publisher || source.url)}</a><br>${esc(source.confidence)} confidence · ${esc(source.timestamp)}</p>`).join("")}
        <h3>Editorial action</h3>
        <textarea id="notes" placeholder="Review notes required for high risk and recommended for approval."></textarea>
        <div class="toolbar">
          <button onclick="act('review')">Review</button>
          <button onclick="act('approve')" class="primary">Approve</button>
          <button onclick="act('schedule')">Schedule</button>
          <button onclick="act('publish_local')" class="primary">Publish local</button>
          <button onclick="act('publish_external')">Publish external</button>
          <button onclick="act('reject')" class="danger">Reject / block</button>
          <button onclick="act('archive')">Archive</button>
        </div>
        <h3>Audit history</h3>
        <div class="audit">${audit.map(row => `<div class="audit-row">${esc(row.stage)} · ${esc(row.action)} · ${esc(row.from_status)} -> ${esc(row.to_status)} · ${new Date(row.created_at * 1000).toLocaleString()}</div>`).join("")}</div>
      `;
    }
    async function loadObjects() {
      statusEl.textContent = "Loading orientation objects...";
      const params = new URLSearchParams();
      if (statusFilter.value) params.set("status", statusFilter.value);
      if (rubricFilter.value) params.set("rubric", rubricFilter.value);
      const res = await fetch(`/jazekker/orientation-objects?${params.toString()}`, {headers: headers()});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
      objects = data.objects || [];
      renderFilters(data.workflow_statuses || []);
      renderList();
      statusEl.textContent = `Loaded ${objects.length} objects.`;
    }
    async function loadDetail(id) {
      const res = await fetch(`/jazekker/orientation-objects/${encodeURIComponent(id)}`, {headers: headers()});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
      renderDetail(data);
    }
    async function act(action) {
      const notes = document.getElementById("notes")?.value || "";
      const target = action === "publish_external" ? "external" : action === "publish_local" ? "local" : null;
      const res = await fetch(`/jazekker/orientation-objects/${encodeURIComponent(selected)}/action`, {
        method: "POST",
        headers: headers(),
        body: JSON.stringify({action, reviewer: "owner", notes, publication_target: target})
      });
      const data = await res.json();
      if (!res.ok) { statusEl.textContent = `Error: ${data.detail || JSON.stringify(data)}`; return; }
      statusEl.textContent = `${action} complete.`;
      objects = objects.map(o => o.id === data.object.id ? data.object : o);
      renderDetail(data);
    }
    async function post(url) {
      const res = await fetch(url, {method: "POST", headers: headers()});
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || JSON.stringify(data));
      statusEl.textContent = `${data.status}: ${data.count || data.returned || 0}`;
      await loadObjects();
    }
    document.getElementById("seedLocal").onclick = () => post("/jazekker/orientation-objects/ingest-local").catch(err => statusEl.textContent = `Error: ${err.message}`);
    document.getElementById("ingestNews").onclick = () => post("/jazekker/orientation-objects/ingest-news").catch(err => statusEl.textContent = `Error: ${err.message}`);
    document.getElementById("refresh").onclick = () => loadObjects().catch(err => statusEl.textContent = `Error: ${err.message}`);
    statusFilter.onchange = () => loadObjects().catch(err => statusEl.textContent = `Error: ${err.message}`);
    rubricFilter.onchange = () => loadObjects().catch(err => statusEl.textContent = `Error: ${err.message}`);
    loadObjects().catch(() => {});
  </script>
</body>
</html>
