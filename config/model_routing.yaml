routes:
  - name: sensitive_local_only
    provider: ollama
    reason: sensitive_data_local_intelligence
    when:
      risk_level: high
      max_cost: 999

  - name: local_only_sensitive
    provider: local
    reason: sensitive_or_local_policy
    when:
      risk_level: high
      max_cost: 999

  - name: low_cost_content
    provider: gemini
    reason: low_risk_low_cost_content
    when:
      risk_level: low
      mode: content
      max_cost: 0.05

  - name: free_cloud_public
    provider: openrouter
    reason: public_low_risk_free_cloud
    when:
      risk_level: low
      max_cost: 0.00

  - name: critical_reasoning
    provider: openai
    reason: critical_reasoning_route
    when:
      risk_level: medium
      max_cost: 0.10

  - name: cheap_bulk_processing
    provider: ollama
    reason: cheap_bulk_processing_local_model
    when:
      risk_level: low
      max_cost: 0.01

models:
  openai:
    default: gpt-4.1-mini
  gemini:
    default: gemini-2.0-flash
  openrouter:
    default: openrouter/free
    free_router: openrouter/free
    llama_free: meta-llama/llama-3.2-3b-instruct:free
  local:
    default: local-safe-fallback
  ollama:
    default: llama3:latest
    coding: qwen2.5-coder:latest
    reasoning: deepseek-r1:latest
    compact: phi3:latest
    lightweight: gemma2:2b
  claude:
    default: claude-3-5-sonnet
  deepseek:
    default: deepseek-chat
  mistral:
    default: mistral-small

local_runtime:
  supported:
    - llama3
    - mistral
    - phi
    - qwen-coder
    - gemma
    - deepseek
  runtimes:
    - ollama
    - gguf
    - cpu
    - gpu
  offline_operation: true

voice_routing:
  stt:
    private: whisper_local
    public: openai_realtime
  tts:
    private: piper
    public: elevenlabs
  latency_target_ms: 800

tool_routing:
  browser_action: plugin_sandbox
  email: approval_center
  calendar: approval_center
  plugin_action: plugin_sandbox
