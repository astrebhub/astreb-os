version: "1.0"
project: "ai_cabinet"
profile: "editorial_governance_workspace"

principles:
  - id: "human_in_the_loop"
    rule: "Critical actions require human validation."
  - id: "policy_before_generation"
    rule: "Governance rules execute before AI output."
  - id: "explainability"
    rule: "Important decisions must be traceable."
  - id: "quality_over_volume"
    rule: "The system must avoid content flooding."
  - id: "signal_over_noise"
    rule: "The system must prioritize valuable information."

data_classes:
  public:
    cloud_allowed: true
    mask_required: false
    default_approval: false
  internal:
    cloud_allowed: true
    mask_required: true
    default_approval: true
  confidential:
    cloud_allowed: false
    mask_required: true
    default_approval: true
  personal:
    cloud_allowed: false
    mask_required: true
    default_approval: true

risk_levels:
  low:
    approval_required: false
    allowed_outputs:
      - "analysis"
      - "draft"
      - "recommendation"
  medium:
    approval_required: true
    allowed_outputs:
      - "analysis"
      - "draft"
      - "recommendation"
      - "approval_queue_item"
  high:
    approval_required: true
    allowed_outputs:
      - "analysis"
      - "risk_review"
      - "approval_queue_item"
  critical:
    approval_required: true
    block_by_default: true
    allowed_outputs:
      - "escalation_notice"
      - "risk_review"

editorial_rules:
  fact_interpretation_separation:
    if: "output_contains_factual_claims"
    then:
      require: ["claim_review", "evidence_notes"]
  unsupported_claims:
    if: "claim_confidence < 0.70"
    then:
      require: ["uncertainty_label"]
      forbid: ["present_as_fact"]
  sensitive_topic:
    if: "topic in ['politics', 'health', 'finance', 'law', 'public_safety', 'personal_reputation']"
    then:
      set_risk_at_least: "high"
      require: ["human_review", "source_review"]
  investigative_content:
    if: "editorial_mode == 'investigative'"
    then:
      set_risk_at_least: "high"
      require: ["evidence_matrix", "human_review"]
  ai_spam_prevention:
    if: "content_batch_size > 3"
    then:
      require: ["quality_sampling", "editorial_rationale"]
  manipulative_framing:
    if: "output_uses_fear_hype_or_false_urgency"
    then:
      action: "revise_or_block"

workflow_rules:
  publish:
    if: "intent == 'publish'"
    then:
      require: ["human_approval", "audit_record"]
      forbid: ["direct_agent_execution"]
  external_send:
    if: "intent in ['send_email', 'send_newsletter', 'post_social', 'message_user']"
    then:
      require: ["human_approval", "destination_confirmation"]
      forbid: ["direct_agent_execution"]
  memory_update:
    if: "memory_scope in ['constitution', 'policy', 'strategy', 'audit']"
    then:
      require: ["owner_or_admin_approval"]
      forbid: ["autonomous_update"]
  translation_high_risk:
    if: "workflow == 'translation' and source_risk in ['high', 'critical']"
    then:
      require: ["human_review", "nuance_notes"]
  seo_integrity:
    if: "workflow == 'seo' and proposed_title_changes_meaning"
    then:
      require: ["editor_review"]
  github_external_action:
    if: "workflow == 'github_ops' and intent in ['push', 'merge', 'create_pr', 'close_issue', 'publish_release', 'delete_branch', 'change_repository_settings']"
    then:
      require: ["human_approval", "audit_record", "destination_confirmation"]
      forbid: ["direct_agent_execution"]

agent_permissions:
  editor_agent:
    may: ["outline", "draft", "revise", "quality_review"]
    must_not: ["publish", "override_policy"]
  research_agent:
    may: ["collect_sources", "score_sources", "prepare_evidence_matrix"]
    must_not: ["invent_sources", "present_uncertain_claims_as_fact"]
  seo_agent:
    may: ["suggest_metadata", "suggest_headings", "suggest_internal_links"]
    must_not: ["use_clickbait", "change_meaning_without_review"]
  governance_agent:
    may: ["flag_policy_conflict", "recommend_escalation", "block_recommendation"]
    must_not: ["approve_own_exception"]
  community_agent:
    may: ["classify_messages", "draft_responses", "recommend_moderation"]
    must_not: ["sanction_user_without_approval"]
  translation_agent:
    may: ["translate", "localize", "flag_nuance_risk"]
    must_not: ["remove_context", "soften_material_claims_without_note"]
  risk_sentinel_agent:
    may: ["score_risk", "trigger_approval", "recommend_hold"]
    must_not: ["override_risk_gate"]
  forecasting_agent:
    may: ["define_forecast", "estimate_probability", "track_outcome"]
    must_not: ["present_forecast_as_certainty"]
  ecosystem_strategist_agent:
    may: ["map_ecosystem", "propose_strategy", "identify_opportunities"]
    must_not: ["change_strategy_memory_without_approval"]
  github_manager_agent:
    may: ["analyze_repository", "draft_issue", "draft_pull_request", "draft_release_notes", "review_ci_status", "propose_branch_plan", "queue_github_action_for_approval"]
    must_not: ["push_without_approval", "merge_without_approval", "delete_branch_without_approval", "publish_release_without_approval", "change_repository_settings_without_approval", "store_repository_secrets"]

model_routing:
  local_required_when:
    - "data_class in ['personal', 'confidential']"
    - "local_only_mode == true"
    - "request_contains_unmasked_secret == true"
  cloud_allowed_when:
    - "data_class in ['public', 'internal']"
    - "policy_allows_cloud == true"
    - "masked_if_required == true"
  premium_model_recommended_when:
    - "risk_level in ['medium', 'high']"
    - "workflow in ['investigative', 'governance_analysis', 'strategic_planning']"
    - "quality_requirement == 'high'"

audit_requirements:
  always_log:
    - "request_id"
    - "user_role"
    - "workflow"
    - "domain"
    - "intent"
    - "data_class"
    - "risk_level"
    - "policy_decision"
    - "agent_id"
    - "model_route"
    - "approval_status"
  retain_evidence_for:
    - "article_draft"
    - "investigative_content"
    - "governance_analysis"
    - "strategic_decision"
    - "community_escalation"

quality_gates:
  article_draft:
    require:
      - "clear_structure"
      - "fact_interpretation_map"
      - "source_notes"
      - "risk_review"
  newsletter:
    require:
      - "item_selection_rationale"
      - "duplication_check"
      - "send_approval"
  trend_brief:
    require:
      - "signal_noise_filter"
      - "confidence_notes"
      - "editorial_opportunity"
  strategic_brief:
    require:
      - "scenario_map"
      - "risk_assessment"
      - "decision_log_proposal"

kill_switches:
  emergency_stop:
    if: "EMERGENCY_STOP == true"
    then: "block_all_non_readonly_workflows"
  local_only:
    if: "LOCAL_ONLY_MODE == true"
    then: "route_all_model_calls_local"
